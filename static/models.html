<!DOCTYPE html>
<html>
<head>
    <title>Список моделей</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; text-decoration: none; color: #007bff; }
        .model-section { margin-bottom: 30px; }
        .model-list { border: 1px solid #ddd; border-radius: 5px; padding: 15px; }
        .model-item { padding: 10px; border-bottom: 1px solid #eee; }
        .model-item:last-child { border-bottom: none; }
        .refresh-btn { background: #28a745; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .folder { color: #666; font-size: 12px; }
        .display-name { font-weight: bold; color: #0056b3; } 
    </style>
</head>
<body>
    <h1>🧠 Список моделей</h1>
   <div class="nav">
        <a href="/api/models.html">Модели</a>
        <a href="/api/datasets.html">Датасеты</a>
        <a href="/api/train.html">Обучение</a>
        <a href="/api/predict.html">Предсказание</a>
        <a href="/api/test_ws.html">Тест модели</a>
        <a href="/api/compare.html">Сравнение</a>
    </div>

    <button class="refresh-btn" onclick="loadAllModels()">🔄 Обновить все</button>

    <div class="model-section">
        <h3>🏗️ Архитектуры моделей</h3>
        <div id="architectures" class="model-list">
            <p>Загрузка...</p>
        </div>
    </div>

    <div class="model-section">
        <h3>🎯 Обученные модели</h3>
        <div id="trained-models" class="model-list">
            <p>Загрузка...</p>
        </div>
    </div>

    <script>
        async function loadAllModels() {
            await loadArchitectures();
            await loadTrainedModels();
        }

        async function loadArchitectures() {
            try {
                const response = await fetch('/api/model-architectures');
                const architectures = await response.json();

                const archDiv = document.getElementById('architectures');
                if (architectures.length === 0) {
                    archDiv.innerHTML = '<p>❌ Архитектуры моделей не найдены</p>';
                    return;
                }

                archDiv.innerHTML = architectures.map(arch => `
                    <div class="model-item">
                        <strong>${arch.name}</strong><br>
                        <small>Файл: ${arch.file} | Размер: ${arch.size} | Дата: ${arch.modified}</small>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('architectures').innerHTML = '<p>❌ Ошибка загрузки архитектур</p>';
            }
        }

        async function loadTrainedModels() {
            try {
                const response = await fetch('/api/trained-models');
                const models = await response.json();

                const modelsDiv = document.getElementById('trained-models');
                if (models.length === 0) {
                    modelsDiv.innerHTML = '<p>❌ Обученные модели не найдены</p>';
                    return;
                }

                modelsDiv.innerHTML = models.map(model => `
                    <div class="model-item">
                        <!-- Отображаем display_name как основное имя -->
                        <strong class="display-name">${model.display_name}</strong><br>
                        <!-- Оригинальное имя файла как дополнительная информация -->
                        <small>Файл: ${model.name} | Размер: ${model.size} | Дата: ${model.modified}</small>
                        ${model.folder ? `<br><small class="folder">Папка: ${model.folder}</small>` : ''}
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('trained-models').innerHTML = '<p>❌ Ошибка загрузки обученных моделей</p>';
            }
        }

        loadAllModels();
    </script>
</body>
</html>
